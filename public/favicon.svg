<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2B755" />
      <stop offset="25%" stop-color="#FCEBA4" />
      <stop offset="50%" stop-color="#C59B27" />
      <stop offset="75%" stop-color="#E8C86A" />
      <stop offset="100%" stop-color="#9A7010" />
    </linearGradient>
    <linearGradient id="goldStroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFDF73" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#8A6510" />
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Dark Background -->
  <rect width="512" height="512" rx="100" fill="#000000" />
  <circle cx="256" cy="230" r="200" fill="url(#goldGlow)" />

  <!-- Shield Outline & Outer Suit Silhouette -->
  <!-- Left Outer Shield / Jacket Boundary -->
  <path d="M 125 125 C 125 210, 155 295, 256 385 C 357 295, 387 210, 387 125 C 330 115, 290 100, 256 80 C 222 100, 182 115, 125 125 Z" 
        fill="none" stroke="url(#goldStroke)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Suit Jacket Left Lapel -->
  <path d="M 175 130 L 220 135 L 205 180 L 256 315 L 246 320 C 215 260, 180 205, 168 135 Z" 
        fill="url(#goldGrad)" stroke="#1a1403" stroke-width="2" />

  <!-- Suit Jacket Right Lapel -->
  <path d="M 337 130 L 292 135 L 307 180 L 256 315 L 266 320 C 297 260, 332 205, 344 135 Z" 
        fill="url(#goldGrad)" stroke="#1a1403" stroke-width="2" />

  <!-- White/Gold Shirt Collar -->
  <polygon points="216,105 256,170 236,180 216,118" fill="url(#goldGrad)" />
  <polygon points="296,105 256,170 276,180 296,118" fill="url(#goldGrad)" />

  <!-- Necktie Knot and Body -->
  <!-- Knot -->
  <polygon points="244,170 268,170 264,195 248,195" fill="url(#goldStroke)" />
  <!-- Tie Body -->
  <polygon points="248,195 264,195 270,270 256,290 242,270" fill="url(#goldGrad)" />

  <!-- Pocket Square Accent -->
  <rect x="315" y="220" width="45" height="10" rx="3" fill="url(#goldGrad)" />

  <!-- Bottom Accent Text "OC" / Online Corporate Symbol -->
  <text x="256" y="445" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="34" font-weight="900" fill="url(#goldGrad)" letter-spacing="6">ONLINE CORPORATE</text>
</svg>
